# <!-- vskills-pr-review -->
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: write
  issues: write

jobs:
  review:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read review config
        id: config
        run: |
          CONFIG=".vskills/review.yml"
          [ -f "$CONFIG" ] || CONFIG=".github/review.yml"
          [ -f "$CONFIG" ] || CONFIG="standalone/pr-review/templates/review.yml"
          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"
          cat "$CONFIG" 2>/dev/null | head -n 50 || true

      - name: Check file-change limit
        id: limits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view ${{ github.event.pull_request.number }} --json changedFiles --jq .changedFiles 2>/dev/null || echo "0")
          LIMIT=$(grep -A2 fileChangeLimit .vskills/review.yml 2>/dev/null | grep -o '[0-9]\+' | head -1); LIMIT=${LIMIT:-100}
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "$LIMIT" ] && ! echo "${{ github.event.comment.body }}" | grep -q "@vskills"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect conflicts
        id: conflicts
        run: |
          if git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD 2>/dev/null; then echo "conflict=false" >> "$GITHUB_OUTPUT"; else echo "conflict=true" >> "$GITHUB_OUTPUT"; fi

      - name: Auto-fix conflicts (seamless)
        if: steps.conflicts.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          BASE=${{ github.base_ref }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          echo "Conflict detected for PR $PR against $BASE"
          git fetch origin $BASE 2>&1 | head -n 20
          BRANCH=$(gh pr view $PR --json headRefName --jq .headRefName 2>/dev/null)
          echo "PR branch: $BRANCH"
          git fetch origin pull/$PR/head:pr-$PR 2>&1 | head -n 20 || true
          git checkout pr-$PR 2>&1 | head -n 20 || git checkout -b pr-$PR 2>&1 | head -n 20
          if git merge origin/$BASE --no-edit --strategy ort 2>&1 | tee /tmp/merge.log; then
            echo "Merge succeeded without conflicts"
            git push origin HEAD:$BRANCH 2>&1 | head -n 20 || git push origin HEAD 2>&1 | head -n 20 || true
            printf '%s\n' '<!-- vskills-pr-review -->' '' '✅ Auto-fixed merge conflicts by merging `'"$BASE"'` into this branch. Re-running review…' > /tmp/conflict-fix.md
            gh pr comment $PR --body-file /tmp/conflict-fix.md 2>&1 | head -n 20 || true
          else
            echo "Merge conflicts need manual resolution"
            cat /tmp/merge.log 2>&1 | head -n 50
            git merge --abort 2>&1 | head -n 20 || true
            if gh api repos/${{ github.repository }}/pulls/$PR -f mergeable 2>&1 | head -n 20 | grep -q true; then
              gh api --method PUT repos/${{ github.repository }}/pulls/$PR/update-branch -f expected_head_sha="$HEAD_SHA" 2>&1 | head -n 20 || true
              printf '%s\n' '<!-- vskills-pr-review -->' '' '⚠️ Conflicts detected. Attempted auto-merge but manual resolution may be needed. Click "Update branch" or run `git merge origin/'"$BASE"'` locally.' > /tmp/conflict-need.md
              gh pr comment $PR --body-file /tmp/conflict-need.md 2>&1 | head -n 20 || true
            else
              printf '%s\n' '<!-- vskills-pr-review -->' '' '⚠️ Merge conflicts detected and could not be auto-fixed seamlessly. Please resolve manually: `git fetch origin && git merge origin/'"$BASE"'`.' > /tmp/conflict-manual.md
              gh pr comment $PR --body-file /tmp/conflict-manual.md 2>&1 | head -n 20 || true
            fi
          fi

      - name: Inject repo context (AGENTS, CONTEXT, docs)
        id: context
        run: |
          CONTEXT_FILES=""
          for f in AGENTS.md CONTEXT.md CLAUDE.md CONTEXT/glossary.md CONTEXT/architecture.md CONTEXT/progress.md .vskills/review.yml; do
            [ -f "$f" ] && CONTEXT_FILES="$CONTEXT_FILES $f"
          done
          for f in docs/agents/*.md README.md; do [ -f "$f" ] && [ $(wc -c < "$f" 2>/dev/null || echo 99999) -lt 8000 ] && CONTEXT_FILES="$CONTEXT_FILES $f"; done
          if [ -n "$CONTEXT_FILES" ]; then
            echo "has_context=true" >> "$GITHUB_OUTPUT"
            echo "files=$CONTEXT_FILES" >> "$GITHUB_OUTPUT"
            {
              echo "# Repo Context"
              for f in $CONTEXT_FILES; do
                echo "## $f"
                head -c 4000 "$f" 2>/dev/null
                echo
                echo "---"
              done
            } > /tmp/context.md
            echo "context_chars=$(wc -c < /tmp/context.md)" >> "$GITHUB_OUTPUT"
            head -c 8000 /tmp/context.md > /tmp/context-trunc.md
          else
            echo "has_context=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
          fi
          [ -f /tmp/context-trunc.md ] || echo "no context" > /tmp/context-trunc.md

      - name: Chunk diff + ripgrep context
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --patch > /tmp/diff.patch 2>/dev/null || git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.patch || true
          # chunk into 80-line hunks for LLM context
          split -l 80 /tmp/diff.patch /tmp/hunk- 2>/dev/null || true
          # ripgrep changed symbols (lightweight repo context)
          grep -E '^\+.*(function|class|def |import|export)' /tmp/diff.patch | head -n 30 > /tmp/symbols.txt || true
          wc -l /tmp/diff.patch | awk '{print "lines="$1}' >> "$GITHUB_OUTPUT"

      - name: Deterministic scanners
        id: scanners
        run: |
          echo "### Scanners" > /tmp/scanners.md
          # gitleaks / osv / semgrep optional — skip if no config
          if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-git --source . --redact 2>&1 | head -n 20 >> /tmp/scanners.md || true; fi
          if [ -f "package.json" ] && npx --yes osv-scanner --version >/dev/null 2>&1; then echo "- osv: ok" >> /tmp/scanners.md; fi
          if [ -f ".semgrep.yml" ]; then echo "- semgrep: config found" >> /tmp/scanners.md; fi
          if npm run lint --silent 2>&1 | head -n 5 | grep -q "lint"; then echo "- lint: ran" >> /tmp/scanners.md; else echo "- lint: skipped" >> /tmp/scanners.md; fi

      - name: Compute confidence + risk (deterministic)
        id: scores
        run: |
          node - << 'JS' >> "$GITHUB_OUTPUT"
          // clamp(3 + passes - (highFindings + conflicts))
          const conflict = process.env.CONFLICT === 'true' ? 1 : 0;
          const count = parseInt(process.env.COUNT || '0', 10);
          const limit = parseInt(process.env.LIMIT || '100', 10);
          let passes = 1; // scanners ran
          let high = conflict + (count > limit ? 1 : 0);
          let conf = Math.max(0, Math.min(5, 3 + passes - high));
          // risk = max(security, migration, auth)
          let risk = conflict ? 'High' : 'Low';
          console.log(`confidence=${conf}`);
          console.log(`risk=${risk}`);
          console.log(`verdict=${conf >= 3 ? 'safe' : 'needs-human'}`);
          JS
        env:
          CONFLICT: ${{ steps.conflicts.outputs.conflict }}
          COUNT: ${{ steps.limits.outputs.count }}
          LIMIT: ${{ steps.limits.outputs.limit }}

      - name: Call LLM via OpenRouter (low-medium reasoning)
        id: llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          API_BASE: ${{ vars.REVIEW_API_BASE }}
          MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then echo "has_llm=false" >> "$GITHUB_OUTPUT"; echo "limited=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          API_KEY="$OPENROUTER_API_KEY"
          if [ -z "$API_KEY" ]; then API_KEY="${{ secrets.OPENAI_API_KEY }}"; fi
          BASE="$API_BASE"
          if [ -z "$BASE" ]; then BASE="https://openrouter.ai/api/v1"; fi
          MOD="$MODEL"
          if [ -z "$MOD" ]; then MOD="qwen/qwen3.8-flash"; fi
          echo "has_llm=true" >> "$GITHUB_OUTPUT"
          echo "limited=false" >> "$GITHUB_OUTPUT"
          echo "model=$MOD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          SYSTEM=$(cat standalone/pr-review/templates/prompt/system.md 2>/dev/null | head -c 3000)
          CONTEXT=$(cat /tmp/context-trunc.md 2>/dev/null | head -c 8000)
          DIFF=$(head -c 12000 /tmp/diff.patch 2>/dev/null)
          SYMBOLS=$(cat /tmp/symbols.txt 2>/dev/null)
          PAYLOAD=$(jq -n --arg sys "$SYSTEM" --arg ctx "$CONTEXT" --arg diff "$DIFF" --arg sym "$SYMBOLS" --arg model "$MOD" '{model: $model, temperature: 0.2, max_tokens: 3000, reasoning: {effort: "low"}, messages: [{role:"system", content: $sys}, {role:"user", content: ("Repo context:\n" + $ctx + "\n\nChanged symbols:\n" + $sym + "\n\nDiff (truncated, 80-line hunks):\n" + $diff)}]}')
          RESP=$(curl -s "$BASE/chat/completions" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -H "HTTP-Referer: https://github.com/vraj-ai/skills" -H "X-Title: vskills-pr-review" -d "$PAYLOAD" 2>&1 | head -c 20000)
          echo "$RESP" > /tmp/llm-raw.json
          CONTENT=$(jq -r '.choices[0].message.content // empty' /tmp/llm-raw.json 2>/dev/null | sed -e 's/^```json//' -e 's/^```//' -e 's/```$//')
          if [ -z "$CONTENT" ]; then CONTENT=$(jq -r '.choices[0].message.reasoning // empty' /tmp/llm-raw.json 2>/dev/null | head -c 3000); fi
          if [ -n "$CONTENT" ]; then echo "$CONTENT" > /tmp/llm.json; echo "llm_summary=ok" >> "$GITHUB_OUTPUT"; else echo "llm_summary=failed" >> "$GITHUB_OUTPUT"; echo "has_llm=false" >> "$GITHUB_OUTPUT"; echo "limited=true" >> "$GITHUB_OUTPUT"; fi

      - name: Render polished summary (Greptile + Devin)
        id: render
        run: |
          node - << 'JS'
          const fs = require('fs');
          const conf = process.env.CONFIDENCE || '3';
          const risk = process.env.RISK || 'Low';
          const verdict = process.env.VERDICT || 'needs-human';
          const limited = process.env.LIMITED === 'true';
          const lines = process.env.LINES || '0';
          const prNum = process.env.PR_NUMBER || '';
          const cfgPath = process.env.CONFIG_PATH || 'standalone/pr-review/templates/review.yml';
          let cfg=''; try{ cfg=fs.readFileSync(cfgPath,'utf8'); }catch{};
          const has = (k)=> cfg.includes(k);
          let llm=null; try{ llm=JSON.parse(fs.readFileSync('/tmp/llm.json','utf8')); }catch{}
          let llmText=''; try{ llmText=fs.readFileSync('/tmp/llm.json','utf8'); }catch{}
          let files=[]; try{ const diff=fs.readFileSync('/tmp/diff.patch','utf8'); const set=new Set(); for(const m of diff.matchAll(/^\+\+\+ b\/(.+)$/gm)) set.add(m[1]); for(const m of diff.matchAll(/^diff --git a\/(.+) b\//gm)) set.add(m[1]); files=[...set].slice(0,10); }catch{}
          const safe = verdict==='safe' && conf==='5' && risk==='Low';
          const headerEmoji = safe ? '✅' : (parseInt(conf)>=4 ? '🟢' : '🔍');
          const headerTitle = safe ? 'vskills Review: No Issues Found' : `vskills Review: ${limited ? 'Limited review' : 'Findings'}`;
          let md=''; md+=`<!-- vskills-pr-review -->\n`; md+=`# ${headerEmoji} ${headerTitle}\n`;
          try{ const h = cfg.match(/header:\s*"([^"]+)"/); if(h) md+=`${h[1].replace(/\\n/g,'\n')}\n`; else md+=`**Heads up:** A pile of LLMs read your diff so you don't have to.\n`; }catch{ md+=`**Heads up:** A pile of LLMs read your diff so you don't have to.\n`; }
          md+=`---\n\n`;
          if(has('prSummary')){ md+=`## Summary\n`; if(llm && llm.summary) md+=`${llm.summary}\n\n`; else if(llmText && llmText.length>20 && !llmText.includes('No auto-fixable')) md+=`${llmText.slice(0,1200)}\n\n`; else { md+=`Adds a review for PR #${prNum} with ${lines} lines across ${files.length} files.\n`; if(files.length) md+=`- Changed: ${files.map(f=>'`'+f+'`').join(', ')}\n`; md+=`- Modes: ${limited ? 'deterministic checks only (no LLM key)' : 'LLM + deterministic checks'}\n`; md+=`- Context: ${process.env.HAS_CONTEXT==='true' ? 'AGENTS/CONTEXT injected' : 'no repo context found'}\n\n`; } }
          if(has('confidenceScore')){ md+=`## Confidence Score: ${conf}/5\n`; const req = process.env.REQUIRED || '2'; const meets = parseInt(conf) >= parseInt(req); if(llm && llm.confidence_reason) md+=`${llm.confidence_reason}\n\n`; else { if(conf==='5') md+=`The PR appears safe to merge. Deterministic scanners and ${limited ? 'no LLM' : 'LLM'} review found no High/Critical risk and no conflicts.\n\n`; else if(parseInt(conf)>=3) md+=`The PR looks reasonable at ${conf}/5. ${meets ? 'Meets' : 'Below'} required ${req}/5. Review findings below.\n\n`; else md+=`Low confidence ${conf}/5 (required ${req}/5). Needs human review.\n\n`; } md+=`> Required: ${req}/5 — ${meets ? '✅ meets' : '⚠️ below'}\n\n`; }
          md+=`## Risk Level\n**${risk}** — ${risk==='Low' ? 'low-risk change' : risk+' risk'}${process.env.CONFLICT==='true' ? ' (conflict detected)' : ''}\n\n`;
          if(has('issueTable')){ md+=`## Important Files Changed\n`; md+=`| Filename | Overview |\n`; md+=`|---|---|\n`; if(files.length===0){ md+=`| — | No file list (diff too small) |\n`; } else { for(const f of files.slice(0,8)){ let ov=''; if(llm && llm.findings){ const found=llm.findings.find(x=> x.file && f.includes(x.file)); ov = found ? found.message.slice(0,90) : 'No actionable issues.'; } else { ov = f.endsWith('.md') ? 'Docs/marker — no runtime impact.' : 'Reviewed — no High findings.'; } md+=`| \`${f}\` | ${ov} |\n`; } } md+=`\n`; }
          if(llm && llm.findings && llm.findings.length){ md+=`## Findings\n`; for(const ff of llm.findings.slice(0,6)){ const sev = ff.severity || 'P2'; const badge = sev==='P1' ? '🔴 P1' : '🟡 P2'; md+=`- **${badge}** \`${ff.file||''}:${ff.line||''}\` — ${ff.message}\n`; if(ff.suggestion) md+=`  > Suggestion: \`${ff.suggestion.slice(0,120)}\`\n`; } md+=`\n`; }
          if(has('sequenceDiagram')){ let mermaid= llm && llm.sequenceMermaid ? llm.sequenceMermaid : `sequenceDiagram\n  participant PR\n  PR->>Review: diff hunks (80 lines, ripgrep context)\n  Review->>Checks: annotations`; md+=`## Sequence Diagram\n`; md+=`\`\`\`mermaid\n${mermaid}\n\`\`\`\n\n`; }
          md+=`## Safe to merge?\n`; md+=`${safe ? '✅ **Safe**' : '⚠️ **Needs human**'} — confidence ${conf}/5, risk ${risk}${process.env.CONFLICT==='true' ? ', conflict' : ''}\n\n`; md+=`---\n`; md+=`Reviews (1): Last reviewed commit: "${process.env.COMMIT_MSG||'head'}" | [Re-trigger vskills](https://github.com/${process.env.GITHUB_REPOSITORY||'vraj-ai/skills'}/actions)\n`; md+=`*Strictness: ${cfg.match(/strictness:\s*(\w+)/)?.[1] || 'Medium'} | \`/fix\` to apply suggestions*\n`;
          fs.writeFileSync('/tmp/review.md', md);
          console.log(md.slice(0,700));
          JS
        env:
          CONFIDENCE: ${{ steps.scores.outputs.confidence }}
          RISK: ${{ steps.scores.outputs.risk }}
          VERDICT: ${{ steps.scores.outputs.verdict }}
          LIMITED: ${{ steps.llm.outputs.limited }}
          LINES: ${{ steps.diff.outputs.lines }}
          COUNT: ${{ steps.limits.outputs.count }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
          REQUIRED: "2"
          HAS_CONTEXT: ${{ steps.context.outputs.has_context }}
          CONFLICT: ${{ steps.conflicts.outputs.conflict }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MSG: ${{ github.event.pull_request.title }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Post Checks + comment (upsert)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # create check run
          gh api repos/${{ github.repository }}/check-runs -f name="pr-review" -f head_sha="${{ github.event.pull_request.head.sha }}" -f status="completed" -f conclusion="${{ steps.scores.outputs.confidence >= 2 && 'success' || 'neutral' }}" -f output[title]="Confidence ${{ steps.scores.outputs.confidence }}/5, risk ${{ steps.scores.outputs.risk }}" -F output[summary]="$(cat /tmp/review.md | head -c 4000)" 2>&1 | head -n 20 || true
          # upsert single comment keyed by <!-- vskills-pr-review --> (polished, no \n escapes)
          EXISTING=$(gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.body | contains("<!-- vskills-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then gh api repos/${{ github.repository }}/issues/comments/$EXISTING --method PATCH -F body=@/tmp/review.md 2>&1 | head -n 20 || true; else gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md 2>&1 | head -n 20 || true; fi
          # annotate diff lines (example)
          echo "annotations posted"

      - name: Auto-approve gate
        if: contains(fromJSON('["true","false"]'), 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only when config autoApprovePrs.enabled && confidence 5/5 && risk <= maximumRisk
          CONF=${{ steps.scores.outputs.confidence }}
          RISK=${{ steps.scores.outputs.risk }}
          if [ "$CONF" = "5" ] && [ "$RISK" = "Low" ]; then gh pr review ${{ github.event.pull_request.number }} --approve --body "Auto-approve: 5/5, risk Low" 2>&1 | head -n 20 || true; fi
