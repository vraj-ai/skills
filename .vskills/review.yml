# vskills PR review config — Greptile parity, versioned with standalone/pr-review/templates/review.yml
# Copy is at .vskills/review.yml (fallback .github/review.yml). `setup-vskills` writes this interactively.

when:
  autoReviewOnNewCommits: true
  reviewDraftPrs: false
  fileChangeLimit: 100
  filters: []  # [{ if: "head_branch == 'main'", skip: true }]

summary:
  prSummary:
    enabled: true
    collapsible: false
    defaultOpen: true
  confidenceScore:
    enabled: true
    collapsible: false
    defaultOpen: true
  issueTable:
    enabled: true
    collapsible: false
    defaultOpen: true
  sequenceDiagram:
    enabled: true
    collapsible: false
    defaultOpen: false
  commentsOutsideDiff:
    enabled: true
    collapsible: false
    defaultOpen: false

comments:
  strictness: Medium  # Low | Medium | High — High hides P2s
  header: "**Heads up:** A pile of LLMs read your diff so you don't have to.\n---"
  promptToFixWithAI: true

fix:
  agent: null  # e.g. Claude, Codex — adds one-click Fix buttons in comments when set

statusChecks:
  useStatusChecks: true
  requiredConfidence: 2  # 0-5; 0 never fails on confidence
  postStatusComments: true
  autoApprovePrs:
    enabled: false
    maximumRisk: Low  # Low | Medium | High | Critical
    customInstructions: ""
    filters: []

model:
  provider: openrouter  # openrouter | openai | anthropic | compat
  baseUrl: "https://openrouter.ai/api/v1"
  model: "openai/gpt-4o-mini"  # low latency, openrouter council can escalate to anthropic/claude-3.5-sonnet or google/gemini-2.0-flash at medium
  auth: apikey  # apikey | oauth
  secretName: "OPENROUTER_API_KEY"

context:
  useContextFolder: true
  maxTokens: 8000

# <!-- vskills-pr-review -->
